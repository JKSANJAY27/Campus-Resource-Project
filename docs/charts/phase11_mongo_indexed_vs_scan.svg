<svg xmlns="http://www.w3.org/2000/svg" width="750" height="360" viewBox="0 0 750 360" style="background-color: #0f172a; font-family: ui-sans-serif, system-ui, sans-serif;">
  <text x="375.0" y="30" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">MongoDB: Indexed B-Tree Seek vs. Full Collection Scan</text>
  <text x="375.0" y="48" text-anchor="middle" fill="#94a3b8" font-size="11">Measured on 10K document scale • Lower is better</text>
  <line x1="260.0" y1="60" x2="260.0" y2="216" stroke="#334155" stroke-dasharray="3,3" />
  <text x="260.0" y="234" fill="#94a3b8" font-size="10" text-anchor="middle">0.0ms</text>
  <line x1="342.0" y1="60" x2="342.0" y2="216" stroke="#334155" stroke-dasharray="3,3" />
  <text x="342.0" y="234" fill="#94a3b8" font-size="10" text-anchor="middle">6.4ms</text>
  <line x1="424.0" y1="60" x2="424.0" y2="216" stroke="#334155" stroke-dasharray="3,3" />
  <text x="424.0" y="234" fill="#94a3b8" font-size="10" text-anchor="middle">12.8ms</text>
  <line x1="506.0" y1="60" x2="506.0" y2="216" stroke="#334155" stroke-dasharray="3,3" />
  <text x="506.0" y="234" fill="#94a3b8" font-size="10" text-anchor="middle">19.2ms</text>
  <line x1="588.0" y1="60" x2="588.0" y2="216" stroke="#334155" stroke-dasharray="3,3" />
  <text x="588.0" y="234" fill="#94a3b8" font-size="10" text-anchor="middle">25.6ms</text>
  <line x1="670.0" y1="60" x2="670.0" y2="216" stroke="#334155" stroke-dasharray="3,3" />
  <text x="670.0" y="234" fill="#94a3b8" font-size="10" text-anchor="middle">32.0ms</text>
  <text x="248" y="76" fill="#e2e8f0" font-size="12" text-anchor="end" font-weight="600">Indexed Point Seek</text>
  <text x="248" y="90" fill="#94a3b8" font-size="10" text-anchor="end">B-Tree O(log N) depth 4</text>
  <rect x="260" y="64" width="45.1" height="26" rx="5" fill="#10b981" />
  <text x="313.1" y="82" fill="#f1f5f9" font-size="11" font-weight="bold">3.52ms</text>
  <text x="248" y="128" fill="#e2e8f0" font-size="12" text-anchor="end" font-weight="600">Aggregation Pipeline</text>
  <text x="248" y="142" fill="#94a3b8" font-size="10" text-anchor="end">$match + $unwind + $group</text>
  <rect x="260" y="116" width="210.38125000000002" height="26" rx="5" fill="#3b82f6" />
  <text x="478.38125" y="134" fill="#f1f5f9" font-size="11" font-weight="bold">16.42ms</text>
  <text x="248" y="180" fill="#e2e8f0" font-size="12" text-anchor="end" font-weight="600">Non-Indexed Scan</text>
  <text x="248" y="194" fill="#94a3b8" font-size="10" text-anchor="end">Full collection scan COLLSCAN O(N)</text>
  <rect x="260" y="168" width="358.109375" height="26" rx="5" fill="#f43f5e" />
  <text x="626.109375" y="186" fill="#f1f5f9" font-size="11" font-weight="bold">27.95ms</text>
</svg>