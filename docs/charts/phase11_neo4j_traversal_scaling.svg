<svg xmlns="http://www.w3.org/2000/svg" width="750" height="360" viewBox="0 0 750 360" style="background-color: #0f172a; font-family: ui-sans-serif, system-ui, sans-serif;">
  <text x="375.0" y="30" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">Neo4j: Index-Free Adjacency Multi-Hop Traversal Scaling</text>
  <text x="375.0" y="48" text-anchor="middle" fill="#94a3b8" font-size="11">Pointer dereferencing complexity O(k) per edge • Lower is better</text>
  <line x1="260.0" y1="60" x2="260.0" y2="268" stroke="#334155" stroke-dasharray="3,3" />
  <text x="260.0" y="286" fill="#94a3b8" font-size="10" text-anchor="middle">0.0ms</text>
  <line x1="342.0" y1="60" x2="342.0" y2="268" stroke="#334155" stroke-dasharray="3,3" />
  <text x="342.0" y="286" fill="#94a3b8" font-size="10" text-anchor="middle">2.8ms</text>
  <line x1="424.0" y1="60" x2="424.0" y2="268" stroke="#334155" stroke-dasharray="3,3" />
  <text x="424.0" y="286" fill="#94a3b8" font-size="10" text-anchor="middle">5.6ms</text>
  <line x1="505.99999999999994" y1="60" x2="505.99999999999994" y2="268" stroke="#334155" stroke-dasharray="3,3" />
  <text x="505.99999999999994" y="286" fill="#94a3b8" font-size="10" text-anchor="middle">8.4ms</text>
  <line x1="588.0" y1="60" x2="588.0" y2="268" stroke="#334155" stroke-dasharray="3,3" />
  <text x="588.0" y="286" fill="#94a3b8" font-size="10" text-anchor="middle">11.2ms</text>
  <line x1="670.0" y1="60" x2="670.0" y2="268" stroke="#334155" stroke-dasharray="3,3" />
  <text x="670.0" y="286" fill="#94a3b8" font-size="10" text-anchor="middle">14.0ms</text>
  <text x="248" y="76" fill="#e2e8f0" font-size="12" text-anchor="end" font-weight="600">1-Hop Traversal</text>
  <text x="248" y="90" fill="#94a3b8" font-size="10" text-anchor="end">(:Student)->(:Skill)</text>
  <rect x="260" y="64" width="98.10714285714286" height="26" rx="5" fill="#3b82f6" />
  <text x="366.1071428571429" y="82" fill="#f1f5f9" font-size="11" font-weight="bold">3.35ms</text>
  <text x="248" y="128" fill="#e2e8f0" font-size="12" text-anchor="end" font-weight="600">2-Hop Match</text>
  <text x="248" y="142" fill="#94a3b8" font-size="10" text-anchor="end">(:Student)->(:Skill)<-(:Course)</text>
  <rect x="260" y="116" width="179.22857142857143" height="26" rx="5" fill="#6366f1" />
  <text x="447.2285714285714" y="134" fill="#f1f5f9" font-size="11" font-weight="bold">6.12ms</text>
  <text x="248" y="180" fill="#e2e8f0" font-size="12" text-anchor="end" font-weight="600">Shortest Path (BFS)</text>
  <text x="248" y="194" fill="#94a3b8" font-size="10" text-anchor="end">Bidirectional search to target job</text>
  <rect x="260" y="168" width="217.3" height="26" rx="5" fill="#f59e0b" />
  <text x="485.3" y="186" fill="#f1f5f9" font-size="11" font-weight="bold">7.42ms</text>
  <text x="248" y="232" fill="#e2e8f0" font-size="12" text-anchor="end" font-weight="600">3-Hop DAG Prerequisite</text>
  <text x="248" y="246" fill="#94a3b8" font-size="10" text-anchor="end">Transitive closure (:Skill)*1..3</text>
  <rect x="260" y="220" width="306.0357142857142" height="26" rx="5" fill="#8b5cf6" />
  <text x="574.0357142857142" y="238" fill="#f1f5f9" font-size="11" font-weight="bold">10.45ms</text>
</svg>